<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=/learning_pack.html" />
  <title>Redirecting to Learning Pack</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101c;
      --panel: rgba(11, 19, 33, 0.94);
      --border: rgba(0, 242, 254, 0.18);
      --accent: #00f2fe;
      --text: #edf4fb;
      --muted: #9ab0c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #050b15, #07101c 42%, #091321);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(720px, calc(100% - 32px));
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      padding: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.42);
    }
    .eyebrow {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,242,254,0.3);
      background: rgba(0,242,254,0.1);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 16px 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(0,242,254,0.3);
      background: rgba(0,242,254,0.09);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover,
    a:focus-visible {
      outline: 2px solid #fff08a;
      outline-offset: 3px;
      border-color: #fff08a;
    }
  </style>
</head>
<body>
  <section class="card" aria-label="Learning pack redirect">
    <span class="eyebrow">Learning Pack</span>
    <h1>Redirecting to learning_pack.html</h1>
    <p>The canonical learning pack lives at learning_pack.html. This legacy path stays available for compatibility and forwards you automatically.</p>
    <a href="/learning_pack.html">Open learning_pack.html</a>
  </section>
</body>
</html>
